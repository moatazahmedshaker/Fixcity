name: Fixcity
description: A problem reporting multi-platform project.
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# dependencies
dependencies:
  flutter:
    sdk: flutter
  
  # firebase
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  firebase_auth: ^6.1.1
  
  # map
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  geolocator: ^14.0.2
  
  # utils
  image_picker: ^1.0.4
  random_string: ^2.3.1

# dev dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true